query($filter: IssueFilter!, $cursor: String) {
  issues(filter: $filter, first: 50, after: $cursor) {
    pageInfo { hasNextPage endCursor }
    nodes {
      id
      identifier
      title
      url
      description
      estimate
      priority
      state { name type }
      assignee { name }
      projectMilestone { id }
      project { name initiatives { nodes { name } } }
    }
  }
}
