mutation($id: String!, $input: IssueUpdateInput!) {
  issueUpdate(id: $id, input: $input) {
    success
    issue {
      id
      identifier
      title
      url
      description
      estimate
      priority
      state { name type }
      assignee { name }
      projectMilestone { id }
      project { name initiatives { nodes { name } } }
    }
  }
}
