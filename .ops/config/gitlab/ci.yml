include:
  - component: $CI_SERVER_FQDN/ksoft/creatures/forge@0.20.0-dev.17
  - component: $CI_SERVER_FQDN/ksoft/creatures/linear@0.20.0-dev.17
  - component: $CI_SERVER_FQDN/ksoft/creatures/agents@0.20.0-dev.17
  - component: $CI_SERVER_FQDN/ksoft/creatures/shellops-base@0.20.0-dev.17

stages:
  - linting
  - governance
  - build
  - validation
  - auditing
  - deploy
  - publishing
  - cleanup

variables:
  GIT_DEPTH: "0"
  GIT_SUBMODULE_DEPTH: "1"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

plugin/build:
  extends: [.shellops, .rules--check]
  stage: build
  needs: []
  script:
    - $SHELLOPS_DIR/cli/install esbuild
    - . ./.envrc
    - shell/actions/hermes/build
  artifacts:
    paths:
      - build/
    expire_in: 1 week

plugin/python:
  extends: [.shellops, .rules--check]
  stage: validation
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  needs: []
  script:
    - . ./.envrc
    - uv sync --frozen
    - uv run shell/actions/hermes/check

plugin/javascript:
  extends: [.rules--check]
  stage: validation
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  needs: []
  script:
    - npm install -g "$(node -p "require('./package.json').packageManager")"
    - pnpm install --frozen-lockfile
    - pnpm run lint
    - pnpm run test:lint
    - pnpm run test:unit
    - pnpm run test:pane

plugin/catalog:
  extends: [.shellops, .rules--check]
  stage: validation
  needs: [plugin/build]
  script:
    - $SHELLOPS_DIR/cli/install hermes
    - . ./.envrc
    - hermes plugins validate build

plugin/deploy:
  extends: [.shellops]
  stage: deploy
  needs: [plugin/build, plugin/catalog]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  script:
    - . ./.envrc
    - $SHELLOPS_DIR/action git config Blizz blizz@kernelle-soft.com
    - $SHELLOPS_DIR/action git auth Blizz "$FORGE_ADMIN_TOKEN"
    - shell/actions/hermes/deploy

plugin/catalog-pin:
  extends: [.shellops]
  stage: publishing
  needs: [plugin/deploy]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - . ./.envrc
    - shell/actions/hermes/catalog-pin
