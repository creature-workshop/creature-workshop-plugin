include:
  - component: $CI_SERVER_FQDN/ksoft/creatures/forge@0.20.0-dev.17
  - component: $CI_SERVER_FQDN/ksoft/creatures/linear@0.20.0-dev.17
  - component: $CI_SERVER_FQDN/ksoft/creatures/agents@0.20.0-dev.17
  - component: $CI_SERVER_FQDN/ksoft/creatures/shellops-base@0.20.0-dev.17

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

plugin/python:
  extends: [.shellops]
  stage: validation
  image: python:3.12-slim
  needs: []
  script:
    - pip install -q pyyaml
    - shell/actions/hermes/check

plugin/manifests:
  extends: [.shellops]
  stage: validation
  needs: []
  script:
    - shell/actions/hermes/manifests

plugin/desktop:
  extends: [.shellops]
  stage: validation
  needs: []
  script:
    - $SHELLOPS_DIR/cli/install esbuild
    - . ./.envrc
    - shell/actions/hermes/build

plugin/javascript:
  stage: validation
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  needs: []
  script:
    - npm install -g "$(node -p "require('./package.json').packageManager")"
    - pnpm install --frozen-lockfile
    - pnpm run lint
    - pnpm run test:lint
    - pnpm run test:pane

plugin/deploy:
  extends: [.shellops]
  stage: publishing
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  script:
    - $SHELLOPS_DIR/cli/install esbuild
    - . ./.envrc
    - $SHELLOPS_DIR/action git config Blizz blizz@kernelle-soft.com
    - $SHELLOPS_DIR/action git auth Blizz "$FORGE_ADMIN_TOKEN"
    - shell/actions/hermes/deploy

# After the deploy, the Hermes catalog entry on the org's fork of hermes-agent
# is pinned to the built branch's commit, as the bot's own GitHub account
# (GITHUB_TOKEN). The pull request to NousResearch carries the new pin.
plugin/catalog:
  extends: [.shellops]
  stage: publishing
  needs: [plugin/deploy]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - . ./.envrc
    - shell/actions/hermes/catalog-pin
